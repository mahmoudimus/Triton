name: Install Triton dependencies (Windows)

description: Installs all dependencies required to build and test Triton on Windows

inputs:
  python-version:
    description: Python version to use
    default: '3.11'
  llvm-version:
    description: LLVM version to install
    default: '19'
  capstone-version:
    description: Capstone version to install
    default: '5.0.7'
  capstone-shared:
    description: Build Capstone as a shared library (ON) or a static one (OFF)
    default: 'ON'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Upgrade pip
      run: |
        python -m pip install -U pip
      shell: pwsh

    - name: Install Python build dependencies
      run: |
        python -m pip install setuptools importlib-resources build
      shell: pwsh

    - name: Get CMake
      uses: lukka/get-cmake@latest

    - name: Setup MSVC dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: ${{ inputs.llvm-version }}
        directory: ${{ runner.temp }}/llvm

    - name: Install z3
      run: |
        curl.exe -sSL --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 `
          -o "z3-4.16.0-x64-win.zip" "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-win.zip"
        unzip -q z3-4.16.0-x64-win.zip
        echo "Z3_INCLUDE_DIRS=$env:GITHUB_WORKSPACE\z3-4.16.0-x64-win\include" >> $env:GITHUB_ENV
        echo "Z3_LIBRARIES=$env:GITHUB_WORKSPACE\z3-4.16.0-x64-win\bin\libz3.lib" >> $env:GITHUB_ENV
        echo "Z3_BIN_DIR=$env:GITHUB_WORKSPACE\z3-4.16.0-x64-win\bin" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Install Capstone
      run: |
        curl.exe -sSL --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 `
          -o "capstone-${{ inputs.capstone-version }}.tar.xz" "https://github.com/capstone-engine/capstone/releases/download/${{ inputs.capstone-version }}/capstone-${{ inputs.capstone-version }}.tar.xz"
        tar -xf capstone-${{ inputs.capstone-version }}.tar.xz
        cd capstone-${{ inputs.capstone-version }}
        cmake -B build `
          -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF `
          -DCAPSTONE_ARM_SUPPORT=ON `
          -DCAPSTONE_ARM64_SUPPORT=ON `
          -DCAPSTONE_X86_SUPPORT=ON `
          -DCAPSTONE_RISCV_SUPPORT=ON `
          -DBUILD_SHARED_LIBS=${{ inputs.capstone-shared }} `
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release --parallel
        cmake --install build --config Release --prefix install
        echo "CAPSTONE_INCLUDE_DIRS=$env:GITHUB_WORKSPACE\capstone-${{ inputs.capstone-version }}\install\include" >> $env:GITHUB_ENV
        echo "CAPSTONE_LIBRARIES=$env:GITHUB_WORKSPACE\capstone-${{ inputs.capstone-version }}\install\lib\capstone.lib" >> $env:GITHUB_ENV
        echo "CAPSTONE_ROOT=$env:GITHUB_WORKSPACE\capstone-${{ inputs.capstone-version }}\install" >> $env:GITHUB_ENV
        echo "CAPSTONE_BIN_DIR=$env:GITHUB_WORKSPACE\capstone-${{ inputs.capstone-version }}\install\bin" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Install Unicorn and LIEF
      run: |
        python -m pip install unicorn lief
      shell: pwsh
